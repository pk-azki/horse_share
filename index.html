<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sire Trend Terminal 2008-2023</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1016;
      --panel: #121923;
      --panel-2: #182332;
      --line: #2b3848;
      --text: #edf4ff;
      --muted: #9aa8bb;
      --hot: #ffcf5a;
      --cyan: #65d9ff;
      --green: #79df9d;
      --red: #ff7d7d;
      --ink: #070a0f;
      --radius: 8px;
      font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Yu Gothic UI", Meiryo, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      border-right: 1px solid var(--line);
      background: #0f151d;
      padding: 18px;
      overflow: auto;
    }

    main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(460px, 1fr) auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(17px, 5.1vw, 20px);
      margin: 0;
      line-height: 1.2;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .badge {
      border: 1px solid #40546b;
      border-radius: 999px;
      color: var(--cyan);
      padding: 4px 9px;
      font-size: 12px;
      white-space: nowrap;
    }

    .control {
      margin-bottom: 16px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    input[type="search"], input[type="number"], select {
      width: 100%;
      background: #0b1119;
      border: 1px solid #34475d;
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 11px;
      font: inherit;
      outline: none;
    }

    input:focus, select:focus, button:focus-visible {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(101, 217, 255, 0.16);
    }

    .metric-grid, .period-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    button {
      background: #151e2a;
      border: 1px solid #334458;
      border-radius: var(--radius);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      padding: 9px 10px;
    }

    button:hover { border-color: #5f7896; }
    button.active {
      background: var(--hot);
      border-color: var(--hot);
      color: var(--ink);
      font-weight: 700;
    }

    .metric-grid button {
      min-height: 52px;
      padding: 7px 8px;
    }

    .metric-grid strong,
    .metric-grid small {
      display: block;
      line-height: 1.18;
    }

    .metric-grid small {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
    }

    .metric-grid button.active small {
      color: rgba(7, 10, 15, 0.68);
    }

    .metric-note {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      margin-top: 8px;
    }

    .selected {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      min-height: 31px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #1d2a3a;
      border: 1px solid #3b526d;
      border-radius: 999px;
      color: var(--text);
      padding: 5px 9px;
      font-size: 12px;
      max-width: 100%;
    }

    .chip button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0;
      line-height: 1;
    }

    .suggestions {
      display: grid;
      gap: 6px;
      max-height: 230px;
      overflow: auto;
      padding-right: 4px;
    }

    .suggestions button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      text-align: left;
      padding: 8px 9px;
    }

    .suggestions small {
      color: var(--muted);
      white-space: nowrap;
    }

    .graph-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 22px 0;
    }

    .graph-heading h2 {
      margin: 0;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .chart-wrap {
      position: relative;
      margin: 18px 22px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      min-height: 460px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #mainChart {
      min-height: 460px;
    }

    .tooltip {
      position: absolute;
      pointer-events: none;
      min-width: 210px;
      max-width: min(320px, calc(100vw - 40px));
      background: rgba(10, 14, 20, 0.94);
      border: 1px solid #3b526d;
      border-radius: var(--radius);
      padding: 10px 11px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
      transform: translate(12px, 12px);
      display: none;
      z-index: 3;
      font-size: 12px;
    }

    .tooltip b {
      display: block;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .tooltip .row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin: 4px 0;
    }

    .range-panel {
      border-top: 1px solid var(--line);
      padding: 0 22px 18px;
    }

    .navigator {
      height: 98px;
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #0f151d;
      margin-bottom: 12px;
    }

    #miniChart {
      height: 100%;
    }

    .range-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--hot);
    }

    details {
      border-top: 1px solid var(--line);
      margin-top: 16px;
      padding-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    summary {
      color: var(--text);
      cursor: pointer;
      margin-bottom: 10px;
    }

    details .control:last-child {
      margin-bottom: 0;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
    }

    th, td {
      border-bottom: 1px solid #263443;
      padding: 7px 6px;
      text-align: right;
    }

    th:first-child, td:first-child {
      text-align: left;
    }

    @media (max-width: 920px) {
      .shell { grid-template-columns: 1fr; }
      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        order: 2;
      }
      main {
        grid-template-rows: auto auto auto;
        order: 1;
      }
      .range-inputs { grid-template-columns: 1fr; }
      .chart-wrap {
        min-height: min(560px, 62vh);
        margin: 12px 14px 16px;
      }
      #mainChart {
        min-height: min(560px, 62vh);
      }
      .graph-heading {
        padding: 14px 14px 0;
      }
      .graph-heading h2 {
        font-size: 24px;
      }
      .range-panel {
        padding: 0 14px 16px;
      }
    }
  </style>
</head>

  <div class="shell">
    <aside>
      <div class="brand">
        <h1>Sire Trend Terminal</h1>
        <span class="badge">2008-2023年産</span>

      <details>

        <div class="control">

          <div id="suggestions" class="suggestions"></div>
        </div>
      </details>

      <details>
        <summary>データ内訳</summary>
        <div id="diagnostics"></div>
      </details>
    </aside>

    <main>
      <section class="graph-heading">
        <h2>Sire Trend Graph</h2>
        <span class="badge">2008-2023年産</span>
      </section>

      <section class="chart-wrap">
        <canvas id="mainChart"></canvas>
        <div id="tooltip" class="tooltip"></div>
      </section>

      <section class="range-panel">
        <div class="navigator">
          <canvas id="miniChart"></canvas>
        </div>
        <div class="range-inputs">
          <div>
            <label for="startYear">開始年: <span id="startYearLabel">2008</span></label>
            <input id="startYear" type="range" min="2008" max="2023" value="2008">
          </div>
          <div>
            <label for="endYear">終了年: <span id="endYearLabel">2023</span></label>
            <input id="endYear" type="range" min="2008" max="2023" value="2023">
          </div>
          <button id="resetView" hidden>Fit</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const payload = JSON.parse(document.getElementById("sire-data").textContent);
    const rows = payload.rows;
    const diagnostics = payload.diagnostics;
    const years = [...new Set(rows.map((row) => row.y))].sort((a, b) => a - b);
    const colorSet = ["#ffcf5a", "#65d9ff", "#79df9d", "#ff7d7d", "#b9a7ff", "#f39bd4", "#8ce0cf", "#ffab70"];
    const metrics = [
      { key: "prizePerHead", label: "本賞/頭", axisLabel: "本賞/頭（万円）", format: fmt0 },
      { key: "winRate", label: "勝上率", format: fmtPct },
      { key: "aei", label: "AEI", note: "種牡馬の質指数", format: fmt2 },
      { key: "cpi", label: "CPI", note: "繁殖牝馬の質指数", format: fmt2 },
      { key: "cpiIndex", label: "AEI/CPI", note: "繁殖牝馬の質に対する種牡馬評価指数", format: fmt1 },
    ];

    const state = {
      metric: "prizePerHead",
      minStarts: 1,
      startYear: Math.min(...years),
      endYear: Math.max(...years),
      selected: ["ディープインパクト","ハーツクライ","ダイワメジャー","キングカメハメハ","ロードカナロア"],
      hoverYear: null,
      hoverSire: null,
    };
    let legendHitAreas = [];

    const bySire = new Map();
    for (const row of rows) {
      if (!bySire.has(row.s)) bySire.set(row.s, []);
      bySire.get(row.s).push(row);
    }
    for (const values of bySire.values()) values.sort((a, b) => a.y - b.y);

    const latestYear = Math.max(...years);
    const sireTotals = [...bySire.entries()].map(([sire, values]) => ({
      sire,
      starts: values.reduce((sum, row) => sum + (row.n || 0), 0),
      latestStarts: values.find((row) => row.y === latestYear)?.n ?? 0,
      years: values.length,
    })).sort((a, b) => b.latestStarts - a.latestStarts || b.starts - a.starts || a.sire.localeCompare(b.sire, "ja"));

    const dom = {
      metricButtons: document.getElementById("metricButtons"),
      minStarts: document.getElementById("minStarts"),
      minStartsLabel: document.getElementById("minStartsLabel"),
      periodButtons: document.getElementById("periodButtons"),
      sireSearch: document.getElementById("sireSearch"),
      selectedSires: document.getElementById("selectedSires"),
      suggestions: document.getElementById("suggestions"),
      diagnostics: document.getElementById("diagnostics"),
      main: document.getElementById("mainChart"),
      mini: document.getElementById("miniChart"),
      tooltip: document.getElementById("tooltip"),
      startYear: document.getElementById("startYear"),
      endYear: document.getElementById("endYear"),
      startYearLabel: document.getElementById("startYearLabel"),
      endYearLabel: document.getElementById("endYearLabel"),
      resetView: document.getElementById("resetView"),
    };

    function fmt0(value) { return value == null ? "-" : Math.round(value).toLocaleString("ja-JP"); }
    function fmt1(value) { return value == null ? "-" : Number(value).toFixed(1); }
    function fmt2(value) { return value == null ? "-" : Number(value).toFixed(2); }
    function fmtPct(value) { return value == null ? "-" : (value * 100).toFixed(1) + "%"; }

    function currentMetric() {
      return metrics.find((metric) => metric.key === state.metric);
    }

    function visibleSeries() {
      return state.selected
        .map((sire, index) => {
          const points = (bySire.get(sire) || [])
            .filter((row) => row.y >= state.startYear && row.y <= state.endYear && row.n >= state.minStarts)
            .map((row) => ({ year: row.y, value: row[state.metric], starts: row.n, raw: row }))
            .filter((point) => point.value != null);
          return { sire, points, color: colorSet[index % colorSet.length] };
        });
    }

    function scaleCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      return { ctx, width: rect.width, height: rect.height };
    }

    function getYDomain(series) {
      const values = series.flatMap((item) => item.points.map((point) => point.value));
      if (!values.length) return [0, 1];
      let min = Math.min(...values);
      let max = Math.max(...values);
      if (min === max) {
        const pad = Math.abs(min || 1) * 0.18;
        min -= pad;
        max += pad;
      } else {
        const pad = (max - min) * 0.12;
        min -= pad;
        max += pad;
      }
      if (state.metric === "winRate") {
        min = Math.max(0, min);
        max = Math.min(1, max);
      }
      if (state.metric === "prizePerHead") {
        min = 0;
      }
      return [min, max];
    }

    function xFor(year, plot) {
      const span = Math.max(1, state.endYear - state.startYear);
      return plot.left + ((year - state.startYear) / span) * plot.width;
    }

    function yFor(value, domain, plot) {
      return plot.top + (1 - (value - domain[0]) / (domain[1] - domain[0])) * plot.height;
    }

    function drawMain() {
      const { ctx, width, height } = scaleCanvas(dom.main);
      const series = visibleSeries();
      const metric = currentMetric();
      const domain = getYDomain(series);
      const plot = { left: 58, right: 24, top: 24, bottom: 42 };
      plot.width = Math.max(1, width - plot.left - plot.right);
      plot.height = Math.max(1, height - plot.top - plot.bottom);

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#0c1016";
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = "#263443";
      ctx.lineWidth = 1;
      ctx.font = "12px Segoe UI, sans-serif";
      ctx.fillStyle = "#9aa8bb";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";

      for (let i = 0; i <= 4; i += 1) {
        const y = plot.top + (plot.height / 4) * i;
        const value = domain[1] - ((domain[1] - domain[0]) / 4) * i;
        ctx.beginPath();
        ctx.moveTo(plot.left, y);
        ctx.lineTo(plot.left + plot.width, y);
        ctx.stroke();
        ctx.fillText(metric.format(value), plot.left - 10, y);
      }

      ctx.save();
      ctx.translate(16, plot.top + plot.height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = "#edf4ff";
      ctx.font = "700 12px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(metric.axisLabel || metric.label, 0, 0);
      ctx.restore();

      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      years.filter((year) => year >= state.startYear && year <= state.endYear).forEach((year) => {
        const x = xFor(year, plot);
        ctx.strokeStyle = year % 5 === 0 ? "#334458" : "#202b38";
        ctx.beginPath();
        ctx.moveTo(x, plot.top);
        ctx.lineTo(x, plot.top + plot.height);
        ctx.stroke();
        if (year % 2 === 0 || state.endYear - state.startYear <= 7) {
          ctx.fillStyle = "#9aa8bb";
          ctx.fillText(String(year), x, plot.top + plot.height + 12);
        }
      });
      ctx.textAlign = "right";
      ctx.fillStyle = "#9aa8bb";
      ctx.fillText("(年産)", plot.left + plot.width, plot.top + plot.height + 28);

      if (state.hoverYear != null) {
        const x = xFor(state.hoverYear, plot);
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.beginPath();
        ctx.moveTo(x, plot.top);
        ctx.lineTo(x, plot.top + plot.height);
        ctx.stroke();
      }

      const orderedSeries = state.hoverSire
        ? [
            ...series.filter((item) => item.sire !== state.hoverSire),
            ...series.filter((item) => item.sire === state.hoverSire),
          ]
        : series;

      orderedSeries.forEach((item) => {
        if (!item.points.length) return;
        ctx.strokeStyle = item.color;
        ctx.lineWidth = item.sire === state.hoverSire ? 4.2 : 2.4;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.beginPath();
        item.points.forEach((point, index) => {
          const x = xFor(point.year, plot);
          const y = yFor(point.value, domain, plot);
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        item.points.forEach((point) => {
          const x = xFor(point.year, plot);
          const y = yFor(point.value, domain, plot);
          ctx.fillStyle = "#0c1016";
          ctx.strokeStyle = item.color;
          ctx.lineWidth = item.sire === state.hoverSire ? 2.8 : 2;
          ctx.beginPath();
          ctx.arc(x, y, state.hoverYear === point.year ? 4.6 : 3.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });
      });

      drawLegend(ctx, series, plot);
      return { plot, domain, series };
    }

    function drawLegend(ctx, series, plot) {
      legendHitAreas = [];
      let x = plot.left;
      let y = 8;
      ctx.font = "12px Segoe UI, sans-serif";
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      series.forEach((item) => {
        const labelWidth = Math.min(170, ctx.measureText(item.sire).width + 28);
        if (x + labelWidth > plot.left + plot.width) {
          x = plot.left;
          y += 20;
        }
        ctx.fillStyle = item.color;
        ctx.fillRect(x, y, 14, 3);
        ctx.fillStyle = "#edf4ff";
        ctx.fillText(item.sire, x + 20, y + 1);
        legendHitAreas.push({ sire: item.sire, x, y: y - 9, width: labelWidth, height: 18 });
        x += labelWidth + 14;
      });
    }

    function drawMini() {
      const { ctx, width, height } = scaleCanvas(dom.mini);
      const allSeries = state.selected.map((sire, index) => ({
        sire,
        color: colorSet[index % colorSet.length],
        points: (bySire.get(sire) || [])
          .filter((row) => row.n >= state.minStarts && row[state.metric] != null)
          .map((row) => ({ year: row.y, value: row[state.metric] })),
      }));
      const values = allSeries.flatMap((item) => item.points.map((point) => point.value));
      const minYear = Math.min(...years);
      const maxYear = Math.max(...years);
      const domain = values.length ? [Math.min(...values), Math.max(...values)] : [0, 1];
      if (domain[0] === domain[1]) domain[1] += 1;
      const plot = { left: 36, right: 18, top: 12, bottom: 18 };
      plot.width = width - plot.left - plot.right;
      plot.height = height - plot.top - plot.bottom;
      const xMini = (year) => plot.left + ((year - minYear) / (maxYear - minYear)) * plot.width;
      const yMini = (value) => plot.top + (1 - (value - domain[0]) / (domain[1] - domain[0])) * plot.height;

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#0f151d";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#263443";
      ctx.beginPath();
      ctx.moveTo(plot.left, plot.top + plot.height);
      ctx.lineTo(plot.left + plot.width, plot.top + plot.height);
      ctx.stroke();

      allSeries.forEach((item) => {
        ctx.strokeStyle = item.color;
        ctx.globalAlpha = 0.75;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        item.points.forEach((point, index) => {
          const x = xMini(point.year);
          const y = yMini(point.value);
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      });
      ctx.globalAlpha = 1;

      const left = xMini(state.startYear);
      const right = xMini(state.endYear);
      ctx.fillStyle = "rgba(255, 207, 90, 0.12)";
      ctx.fillRect(left, plot.top, right - left, plot.height);
      ctx.strokeStyle = "#ffcf5a";
      ctx.strokeRect(left, plot.top, right - left, plot.height);
    }

    function renderMetricButtons() {
      dom.metricButtons.innerHTML = "";
      metrics.forEach((metric) => {
        const button = document.createElement("button");
        const label = document.createElement("strong");
        label.textContent = metric.label;
        button.appendChild(label);
        if (metric.note) {
          const note = document.createElement("small");
          note.textContent = metric.note;
          button.appendChild(note);
        }
        button.className = metric.key === state.metric ? "active" : "";
        button.addEventListener("click", () => {
          state.metric = metric.key;
          render();
        });
        dom.metricButtons.appendChild(button);
      });
    }

    function renderSelected() {
      dom.selectedSires.innerHTML = "";
      state.selected.forEach((sire) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        const label = document.createElement("span");
        label.textContent = sire;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "×";
        remove.title = sire + "を外す";
        remove.addEventListener("click", () => {
          state.selected = state.selected.filter((item) => item !== sire);
          render();
        });
        chip.append(label, remove);
        dom.selectedSires.appendChild(chip);
      });
    }

    function renderSuggestions() {
      const query = dom.sireSearch.value.trim().toLowerCase();
      const list = sireTotals
        .filter((item) => !state.selected.includes(item.sire))
        .filter((item) => !query || item.sire.toLowerCase().includes(query))
        .slice(0, 18);

      dom.suggestions.innerHTML = "";
      list.forEach((item) => {
        const button = document.createElement("button");
        const name = document.createElement("span");
        const meta = document.createElement("small");
        name.textContent = item.sire;
        meta.textContent = latestYear + "年産 " + item.latestStarts.toLocaleString("ja-JP") + "頭";
        button.append(name, meta);
        button.addEventListener("click", () => {
          state.selected = [...state.selected, item.sire].slice(-8);
          dom.sireSearch.value = "";
          render();
        });
        dom.suggestions.appendChild(button);
      });
    }

    function renderDiagnostics() {
      const yearRows = diagnostics.yearCounts
        .map((row) => "<tr><td>" + row.year + "年産</td><td>" + row.starts.toLocaleString("ja-JP") + "頭</td></tr>")
        .join("");
      dom.diagnostics.innerHTML =
        "<table><thead><tr><th>年産</th><th>頭数</th></tr></thead><tbody>" + yearRows + "</tbody></table>" +
        "<p>全" + diagnostics.sireCount.toLocaleString("ja-JP") + "種牡馬</p>";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      }[char]));
    }

    function setPeriod(period) {
      const maxYear = Math.max(...years);
      if (period === "all") {
        state.startYear = Math.min(...years);
      } else {
        state.startYear = Math.max(Math.min(...years), maxYear - Number(period) + 1);
      }
      state.endYear = maxYear;
      [...dom.periodButtons.querySelectorAll("button")].forEach((button) => {
        button.classList.toggle("active", button.dataset.period === period);
      });
      syncRangeInputs();
      render();
    }

    function syncRangeInputs() {
      if (state.startYear > state.endYear) [state.startYear, state.endYear] = [state.endYear, state.startYear];
      dom.startYear.value = state.startYear;
      dom.endYear.value = state.endYear;
      dom.startYearLabel.textContent = state.startYear;
      dom.endYearLabel.textContent = state.endYear;
      dom.minStarts.value = state.minStarts;
    }

    function showTooltip(event) {
      const rect = dom.main.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const yearSpan = Math.max(1, state.endYear - state.startYear);
      const plot = { left: 58, right: 24, top: 24, bottom: 42 };
      plot.width = rect.width - plot.left - plot.right;
      if (x < plot.left || x > plot.left + plot.width) {
        hideTooltip();
        return;
      }
      const rawYear = state.startYear + ((x - plot.left) / plot.width) * yearSpan;
      const year = Math.round(rawYear);
      state.hoverYear = Math.max(state.startYear, Math.min(state.endYear, year));
      const metric = currentMetric();
      const series = visibleSeries();
      const items = series.map((item) => {
        const point = item.points.find((candidate) => candidate.year === state.hoverYear);
        return { ...item, point };
      }).filter((item) => item.point);
      if (!items.length) {
        hideTooltip();
        drawMain();
        return;
      }
      const domain = getYDomain(series);
      const mouseY = event.clientY - rect.top;
      state.hoverSire = items
        .map((item) => {
          const y = 24 + (1 - (item.point.value - domain[0]) / (domain[1] - domain[0])) * (rect.height - 24 - 42);
          return { sire: item.sire, distance: Math.abs(y - mouseY) };
        })
        .sort((a, b) => a.distance - b.distance)[0]?.sire ?? null;
      dom.tooltip.innerHTML = "<b>" + state.hoverYear + "年 / " + metric.label + "</b>" + items
        .map((item) => '<div class="row"><span style="color:' + item.color + '">' + escapeHtml(item.sire) + '</span><span>' + metric.format(item.point.value) + " / " + item.point.starts + "頭</span></div>")
        .join("");
      dom.tooltip.style.display = "block";
      dom.tooltip.style.left = Math.min(event.clientX - rect.left, rect.width - 340) + "px";
      dom.tooltip.style.top = Math.min(event.clientY - rect.top, rect.height - 180) + "px";
      drawMain();
    }

    function hideTooltip() {
      state.hoverYear = null;
      state.hoverSire = null;
      dom.tooltip.style.display = "none";
      drawMain();
    }

    function render() {
      renderMetricButtons();
      renderSelected();
      renderSuggestions();
      syncRangeInputs();
      drawMain();
      drawMini();
    }

    let resizeFrame = 0;
    function scheduleRender() {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(render);
    }

    dom.minStarts.addEventListener("input", () => {
      state.minStarts = Number(dom.minStarts.value);
      render();
    });
    dom.sireSearch.addEventListener("input", renderSuggestions);
    dom.startYear.addEventListener("input", () => {
      state.startYear = Number(dom.startYear.value);
      if (state.startYear > state.endYear) state.endYear = state.startYear;
      syncRangeInputs();
      render();
    });
    dom.endYear.addEventListener("input", () => {
      state.endYear = Number(dom.endYear.value);
      if (state.endYear < state.startYear) state.startYear = state.endYear;
      syncRangeInputs();
      render();
    });
    dom.resetView.addEventListener("click", () => setPeriod("all"));
    dom.periodButtons.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-period]");
      if (button) setPeriod(button.dataset.period);
    });
    dom.main.addEventListener("pointermove", showTooltip);
    dom.main.addEventListener("pointerleave", hideTooltip);
    window.addEventListener("resize", scheduleRender);

    renderDiagnostics();
    syncRangeInputs();
    render();
  </script>
</body>
</html>
